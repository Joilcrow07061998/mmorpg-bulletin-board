{% extends 'board/base.html' %}

{% block title %}Выход из системы{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 my-5">
        <div class="card border-warning shadow-sm">
            <div class="card-body text-center p-4">
                <h1 class="h4 text-warning mb-3">Выход из аккаунта</h1>
                <p class="text-muted">Вы уверены, что хотите выйти из своей учетной записи?</p>

                <form method="post" action="{% url 'account_logout' %}" class="mt-4">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger px-4">Да, выйти</button>
                    <a href="{% url 'board:post_list' %}" class="btn btn-outline-secondary ms-2">Отмена</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
