{% extends 'board/base.html' %}

{% block title %}Отклик{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 my-4">
        <div class="card shadow-sm">
            <div class="card-header bg-dark text-white">
                <h1 class="h5 mb-0">Отклик на объявление</h1>
            </div>
            <div class="card-body">
                <h2 class="h5 mb-3">{{ post.headline }}</h2>

                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="btn btn-primary">Отправить отклик</button>
                    <a href="{% url 'board:post_list' %}" class="btn btn-outline-secondary ms-2">Отмена</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
